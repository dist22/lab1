apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: postgres:16
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -h postgres -U "$PGUSER" -d "$PGDATABASE"; do sleep 2; done
              psql -h postgres -v ON_ERROR_STOP=1 -f /schema/schema.sql
          env:
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_USER } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: postgres-secret, key: DB_PASSWORD } }
            - name: PGDATABASE
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_DB } }
          volumeMounts:
            - name: schema
              mountPath: /schema
      volumes:
        - name: schema
          configMap:
            name: db-schema